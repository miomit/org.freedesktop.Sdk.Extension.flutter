id: org.freedesktop.Sdk.Extension.flutter
branch: '24.08'
runtime: org.freedesktop.Sdk
build-extension: true
sdk: org.freedesktop.Sdk
runtime-version: '24.08'
separate-locales: false
modules:
  - name: flutter
    buildsystem: simple
    sources:
      - type: archive
        only-arches:
          - x86_64
        url: https://storage.googleapis.com/flutter_infra_release/releases/stable/linux/flutter_linux_3.29.2-stable.tar.xz
        sha256: 6096f21370773093ec19240e133664c1c12eb8b5a85605a92d16ce462a18eac4
        x-checker-data:
          type: anitya
          project-id: 1227
          stable-only: true
          url-template: https://storage.googleapis.com/flutter_infra_release/releases/stable/linux/flutter_linux_$version-stable.tar.xz
    build-commands:
      - install -d /usr/lib/sdk/flutter
      - cp -rpv * /usr/lib/sdk/flutter/

  - name: scripts
    sources:
      - type: script
        commands:
          - export GOROOT=/usr/lib/sdk/flutter
          - export PATH=$PATH:$GOROOT/bin
        dest-filename: enable.sh
    buildsystem: simple
    build-commands:
      - cp enable.sh /usr/lib/sdk/flutter/